<!DOCTYPE html>
<html>
  <head>
    <title>MTG Enhancements Options</title>
  </head>
  <body>
    <h1>MTG Enhancements Options</h1>
    <p>Toggle various options for different sites and features.</p>
    <div id="form_container">
        <form id="mtg_enhancements_options">
            <h2>Scryfall.com</h2>
            <div id="scryfall">
                <div>
                    <p>Select the formats you would like to display the legalities for.</p>
                </div>
                <div>
                    <input type="checkbox" id="scryfall_formats_classic" name="scryfall_formats" value="classic">
                    <label for="scryfall_formats_classic">Classic Legacy</label>
                </div>
                <div>
                    <input type="checkbox" id="scryfall_formats_duel" name="scryfall_formats" value="duel">
                    <label for="scryfall_formats_duel">Duel Commander</label>
                </div>
                <div>
                    <input type="checkbox" id="scryfall_formats_future" name="scryfall_formats" value="future">
                    <label for="scryfall_formats_future">Future Standard</label>
                </div>
                <div>
                    <input type="checkbox" id="scryfall_formats_gladiator" name="scryfall_formats" value="gladiator">
                    <label for="scryfall_formats_gladiator">Gladiator</label>
                </div>
                <div>
                    <input type="checkbox" id="scryfall_formats_heritage" name="scryfall_formats" value="heritage">
                    <label for="scryfall_formats_heritage">Heritage</label>
                </div>
                <div>
                    <input type="checkbox" id="scryfall_formats_oldschool" name="scryfall_formats" value="oldschool">
                    <label for="scryfall_formats_oldschool">Old School</label>
                </div>
                <div>
                    <input type="checkbox" id="scryfall_formats_paupercommander" name="scryfall_formats" value="paupercommander">
                    <label for="scryfall_formats_paupercommander">Pauper Commander</label>
                </div>
                <div>
                    <input type="checkbox" id="scryfall_formats_peak" name="scryfall_formats" value="peak">
                    <label for="scryfall_formats_peak">Peak Legacy</label>
                </div>
                <div>
                    <input type="checkbox" id="scryfall_formats_predh" name="scryfall_formats" value="predh">
                    <label for="scryfall_formats_predh">PreDH</label>
                </div>
                <div>
                    <input type="checkbox" id="scryfall_formats_premodern" name="scryfall_formats" value="premodern">
                    <label for="scryfall_formats_premodern">Premodern</label>
                </div>
                <div>
                    <input type="checkbox" id="scryfall_formats_standardbrawl" name="scryfall_formats" value="standardbrawl">
                    <label for="scryfall_formats_standardbrawl">Standard Brawl</label>
                </div>
                <div>
                    <input type="checkbox" id="scryfall_formats_tlr" name="scryfall_formats" value="tlr">
                    <label for="scryfall_formats_tlr">Tiny Leaders</label>
                </div>
            </div>

            <div id="mtgtop8">
                <h2>MTGTop8.com</h2>
                <div>
                    <p>Select if you want to enable showing Threat Level (in Blechmans).</p>
                </div>
                <div>
                    <input type="checkbox" id="mtgtop8_threat_level" name="mtgtop8_threat_level">
                    <label for="mtgtop8_threat_level">Enable Threat Level</label>
                </div>
            </div>

            <hr>

            <div id="form_controls">
                <div id="status"></div>
                <button type="submit">Save</button>
            </div>
        </form>
    </div>

    <script src="options.js"></script>
  </body>
</html>
